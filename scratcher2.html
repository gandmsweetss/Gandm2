<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G & M Sweets — Your Scratcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Space+Mono:wght@400;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF8EC;
    --gold: #D98F2B;
    --gold-deep: #8A5A22;
    --cherry: #C13B2E;
    --ink: #2B211C;
    --paper: #FFFDF8;
    --line: rgba(43,33,28,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(43,33,28,0.08);
  }
  .steam {
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold-deep);
    font-family: 'Space Mono', monospace;
  }
  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 1.8rem;
    margin: 10px 0 4px;
    color: var(--ink);
  }
  .sub {
    font-size: 0.9rem;
    color: #6b5c4f;
    margin-bottom: 22px;
  }
  .scratch-wrap {
    position: relative;
    max-width: 420px;
    margin: 0 auto;
  }
  #prize-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--gold-deep);
    padding: 16px;
    border-radius: 16px;
    background: var(--cream);
    gap: 4px;
  }
  #scratch-canvas {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 16px;
    touch-action: none;
    cursor: pointer;
    position: relative;
  }
  #instructions {
    font-size: 0.82rem;
    color: #6b5c4f;
    margin-top: 14px;
  }
  #result {
    display: none;
    margin-top: 16px;
    font-size: 0.85rem;
    color: #6b5c4f;
    background: var(--cream);
    border-radius: 12px;
    padding: 12px 14px;
    border: 1px solid var(--line);
  }
  #result b { color: var(--ink); }
  #screenshot-prompt {
    display: none;
    margin-top: 10px;
    background: #fff4e0;
    border: 2px dashed var(--gold);
    color: var(--gold-deep);
    border-radius: 12px;
    padding: 12px 16px;
    text-align: center;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
  }
  #expiry-banner {
    display: none;
    margin-top: 12px;
    background: var(--cherry);
    color: white;
    border-radius: 12px;
    padding: 14px 16px;
    text-align: center;
  }
  #expiry-banner .expiry-headline {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
  }
  #expiry-banner .expiry-date {
    font-size: 0.85rem;
    margin-top: 4px;
    opacity: 0.95;
  }
</style>
</head>
<body>
<div class="card">
  <div class="steam">G & M Sweets</div>
  <h1>Scratch & Win 🎉</h1>
  <div class="sub">You've got one scratcher —
